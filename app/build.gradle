plugins { id 'com.android.application' }

android {
    namespace 'com.ax12.strictguard'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ax12.strictguard'
        minSdk 26
        targetSdk 32
        versionCode 5
        versionName '0.1.4-session-safety'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
